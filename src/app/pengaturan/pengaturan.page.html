<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Pengaturan</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list>

    <ion-item>
      <ion-label>
        <h2>Mode Gelap</h2>
        <p>Aktifkan tampilan gelap aplikasi</p>
      </ion-label>

      <ion-toggle
        slot="end"
        [checked]="darkMode"
        (ionChange)="toggleDarkMode($event)">
      </ion-toggle>
    </ion-item>

  </ion-list>

</ion-content>
