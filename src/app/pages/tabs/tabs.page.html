<!-- Navigasi tab di bagian bawah aplikasi -->
<ion-tabs>

  <!-- Daftar menu tab -->
  <ion-tab-bar slot="bottom">

    <!-- Menu Dashboard -->
    <ion-tab-button tab="dashboard">
      <ion-icon name="speedometer-outline"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>

    <!-- Menu Produk -->
    <ion-tab-button tab="products">
      <ion-icon name="grid-outline"></ion-icon>
      <ion-label>Produk</ion-label>
    </ion-tab-button>

    <!-- Menu Keranjang -->
    <ion-tab-button tab="cart">
      <ion-icon name="cart-outline"></ion-icon>
      <ion-label>Keranjang</ion-label>

      <!-- Menampilkan jumlah barang di keranjang -->
      <ion-badge color="danger" *ngIf="cartService.getTotalItemsCount() > 0">
        {{ cartService.getTotalItemsCount() }}
      </ion-badge>

    </ion-tab-button>

    <!-- Menu Profil -->
    <ion-tab-button tab="profile">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
