<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Daftar Barang</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/product-form">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Searchbar ditaruh di sini agar 100% bebas klik & fokus -->
  <ion-searchbar placeholder="Ketik nama atau kategori barang..." (ionInput)="onSearch($event)"
    style="margin-bottom: 12px;">
  </ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let p of filteredProducts">
      <!-- Thumbnail -->
      <ion-thumbnail slot="start" (click)="goToDetail(p.id)">
        <img [src]="p.imageUrl ? p.imageUrl : prodService.defaultImage" alt="{{ p.name }}" />
      </ion-thumbnail>

      <!-- Info produk -->
      <ion-label (click)="goToDetail(p.id)">
        <h2><b>{{ p.name }}</b></h2>
        <p>Kategori: {{ p.category }}</p>
        <p>Harga: <b>Rp {{ p.sellPrice.toLocaleString('id-ID') }}</b></p>
        <ion-badge [color]="p.stock > 0 ? 'success' : 'danger'">
          Stok: {{ p.stock }}
        </ion-badge>
      </ion-label>

      <!-- Tombol kranjang -->
      <ion-button id="btn-add-{{p.id}}" slot="end" size="small" color="primary" [disabled]="p.stock === 0"
        (click)="$event.stopPropagation(); addToCart(p)">
        <ion-icon slot="icon-only" name="cart"></ion-icon>
      </ion-button>
    </ion-item>

    <ion-item *ngIf="filteredProducts.length === 0">
      <ion-label class="ion-text-center" color="medium">
        Barang tidak ditemukan.
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
