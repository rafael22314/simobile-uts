<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/products"></ion-back-button>
    </ion-buttons>
    <ion-title>Tambah Barang Baru</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="productForm" (ngSubmit)="saveProduct()">
    <ion-list lines="full">
      <!-- Nama Produk -->
      <ion-item>
        <ion-input label="Nama Barang" labelPlacement="stacked" formControlName="name"
          placeholder="Misal: Sabun Mandi"></ion-input>
      </ion-item>
      <ion-text color="danger" class="ion-padding-start"
        *ngIf="productForm.controls['name'].invalid && productForm.controls['name'].touched">
        <small>* Nama barang wajib diisi (minimal 3 karakter).</small>
      </ion-text>

      <!-- Kategori -->
      <ion-item>
        <ion-select label="Kategori" labelPlacement="stacked" formControlName="category">
          <ion-select-option value="Sembako">Sembako</ion-select-option>
          <ion-select-option value="Makanan">Makanan</ion-select-option>
          <ion-select-option value="Minuman">Minuman</ion-select-option>
          <ion-select-option value="Bumbu">Bumbu</ion-select-option>
          <ion-select-option value="Kebersihan">Kebersihan</ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Harga Beli -->
      <ion-item>
        <ion-input type="number" label="Harga Beli (Modal)" labelPlacement="stacked"
          formControlName="buyPrice"></ion-input>
      </ion-item>
      <ion-text color="danger" class="ion-padding-start"
        *ngIf="productForm.controls['buyPrice'].invalid && productForm.controls['buyPrice'].touched">
        <small>* Harga beli harus berupa angka lebih dari 0.</small>
      </ion-text>

      <!-- Harga Jual -->
      <ion-item>
        <ion-input type="number" label="Harga Jual" labelPlacement="stacked" formControlName="sellPrice"></ion-input>
      </ion-item>
      <ion-text color="danger" class="ion-padding-start"
        *ngIf="productForm.controls['sellPrice'].invalid && productForm.controls['sellPrice'].touched">
        <small>* Harga jual harus berupa angka lebih dari 0.</small>
      </ion-text>

      <!-- Stok -->
      <ion-item>
        <ion-input type="number" label="Jumlah Stok" labelPlacement="stacked" formControlName="stock"></ion-input>
      </ion-item>
      <ion-text color="danger" class="ion-padding-start"
        *ngIf="productForm.controls['stock'].invalid && productForm.controls['stock'].touched">
        <small>* Stok tidak boleh bernilai negatif.</small>
      </ion-text>

      <!-- URL Foto (Opsional) -->
      <ion-item>
        <ion-input type="url" label="URL Foto (Opsional)" labelPlacement="stacked" formControlName="imageUrl"
          placeholder="https://..."></ion-input>
      </ion-item>
    </ion-list>

    <div class="ion-padding-top">
      <ion-button expand="block" type="submit" [disabled]="productForm.invalid">
        Simpan Barang
      </ion-button>
    </div>
  </form>

  <!-- Alert Sukses (Week 06 Slide 18-20) -->
  <ion-alert [isOpen]="isSuccessAlertOpen" header="Sukses" message="Barang baru berhasil ditambahkan!"
    [buttons]="['OK']" (didDismiss)="handleAlertDismiss()">
  </ion-alert>
</ion-content>
