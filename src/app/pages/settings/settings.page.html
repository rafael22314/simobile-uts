<!-- Header halaman pengaturan -->
<ion-header>
  <ion-toolbar color="primary">
    <!-- Tombol kembali ke dashboard -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/dashboard"></ion-back-button>
    </ion-buttons>

    <!-- Judul halaman -->
    <ion-title>Pengaturan</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Daftar pengaturan -->
  <ion-list lines="full">
    <ion-item>
      <!-- Icon mode gelap -->
      <ion-icon name="moon-outline" slot="start"></ion-icon>

      <!-- Nama pengaturan -->
      <ion-label>Mode Gelap (Dark Mode)</ion-label>

      <!-- Tombol ON/OFF dark mode -->
      <ion-toggle
        slot="end"
        [(ngModel)]="isDarkMode"
        (ionChange)="toggleTheme()"
      >
      </ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>
