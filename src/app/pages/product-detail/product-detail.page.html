<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/products"></ion-back-button>
    </ion-buttons>
    <ion-title>Detail & Edit Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" *ngIf="product">
  <!-- Kartu Info Produk -->
  <ion-card>
    <img [src]="product.imageUrl || prodService.defaultImage" style="width: 100%; height: 200px; object-fit: cover;" />
    <ion-card-header>
      <ion-card-subtitle>{{ product.category }} (Terjual: {{ product.soldCount }})</ion-card-subtitle>
      <ion-card-title>{{ product.name }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Harga Beli: <b>Rp {{ product.buyPrice.toLocaleString('id-ID') }}</b></p>
      <p>Harga Jual: <b style="color: #1b8a5a;">Rp {{ product.sellPrice.toLocaleString('id-ID') }}</b></p>
    </ion-card-content>
  </ion-card>

  <!-- Form Edit Nama dan Stok -->
  <ion-card>
    <ion-card-header>
      <ion-card-title style="font-size: 1.1rem;">Ubah Data Produk</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item lines="full">
          <ion-label position="stacked">Nama Produk</ion-label>
          <ion-input type="text" [(ngModel)]="editName" placeholder="Masukkan nama baru"></ion-input>
        </ion-item>

        <ion-item lines="full">
          <ion-label position="stacked">Stok Produk</ion-label>
          <ion-input type="number" [(ngModel)]="editStock" placeholder="Masukkan stok"></ion-input>
        </ion-item>
      </ion-list>

      <div style="margin-top: 15px;">
        <!-- Tombol Simpan Perubahan -->
        <ion-button expand="block" color="primary" (click)="saveChanges()">
          <ion-icon name="save-outline" slot="start"></ion-icon>
          Simpan Perubahan
        </ion-button>

        <!-- Tombol Hapus Produk (Membuka ion-alert) -->
        <ion-button expand="block" color="danger" fill="outline" id="open-delete-alert" style="margin-top: 10px;">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Hapus Produk
        </ion-button>
      </div>
    </ion-card-content>
  </ion-card>
  
  <ion-alert trigger="open-delete-alert" header="Konfirmasi Hapus"
    message="Apakah Anda yakin ingin menghapus produk ini dari daftar?" [buttons]="alertButtons">
  </ion-alert>
</ion-content>
