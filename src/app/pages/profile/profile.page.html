<!-- Header halaman profil -->
<ion-header>
  <ion-toolbar color="primary">
    <!-- Tombol membuka menu samping -->
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <!-- Judul halaman -->
    <ion-title>Profil Pemilik</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center">
  <!-- Card profil yang akan diberi animasi -->
  <div id="profile-card" style="margin-top: 20px">
    <!-- Foto profil -->
    <ion-avatar style="width: 120px; height: 120px; margin: 0 auto">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/7/74/White_domesticated_duck%2C_stretching.jpg?utm_source=id.wikipedia.org&utm_campaign=index&utm_content=original"
        alt="Bu Marni"
      />
    </ion-avatar>

    <!-- Nama pemilik -->
    <h2 class="ion-padding-top"><b>Ibu Marni</b></h2>

    <!-- Jabatan pemilik -->
    <p>Pemilik Toko Makmur Jaya</p>
  </div>
</ion-content>
